<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self';" />
  <title>Kartograph wird gestartet</title>
  <style>
    :root {
      --bg: #1b1d22;
      --text: #eee9df;
      --text-muted: #a19c8f;
      --border: #33353c;
      --accent: #e8a856;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: transparent;
    }

    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.06);
        opacity: 0.85;
      }
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .progress-track {
      width: 220px;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 4%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.25s ease-out;
    }

    .status {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="../assets/icon-128.png" alt="Kartograph" />
    <div class="brand">Kartograph</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status" id="status-text">Wird gestartet…</div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
